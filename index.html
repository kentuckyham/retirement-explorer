<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retirement Scenario Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f1f5f9; }
  </style>

  <!-- React 18 -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Recharts needs these peer deps loaded as globals first -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Recharts 2.5.0 has a stable UMD build -->
  <script crossorigin src="https://unpkg.com/recharts@2.5.0/umd/Recharts.js"></script>

  <!-- Babel standalone — transpiles the JSX in the browser -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Verify dependencies loaded -->
  <script>
    if (typeof React === "undefined") document.getElementById("root").innerHTML = "<p style='color:red;padding:20px'>Failed to load React. Check your internet connection.</p>";
    else if (typeof Recharts === "undefined") document.getElementById("root").innerHTML = "<p style='color:red;padding:20px'>Failed to load Recharts. Check your internet connection.</p>";
  </script>

  <script type="text/babel" data-type="module">
    // Shim the imports that the JSX expects — these are already global via UMD scripts
    const { useState, useMemo } = React;
    const {
      LineChart, Line, XAxis, YAxis, CartesianGrid,
      Tooltip, Legend, ReferenceLine, ResponsiveContainer,
    } = Recharts;

    // ─────────────────────────────────────────────────────────────────────────────
    // INITIAL SCENARIO PRESETS
    // ─────────────────────────────────────────────────────────────────────────────
    const INITIAL_SCENARIOS = [
      {
        label: "Scenario 1",
        portfolio:      4_800_000,
        spending:         215_000,
        retirementAge:         49,
        equityPct:             74,
        lifeExpectancy:        92,
        ssClaimAge:            70,
        ssBenefit:         53_000,
        cpp:               15_000,
        oas:                7_500,
      },
      {
        label: "Scenario 2",
        portfolio:      5_800_000,
        spending:         215_000,
        retirementAge:         51,
        equityPct:             55,
        lifeExpectancy:        92,
        ssClaimAge:            70,
        ssBenefit:         53_000,
        cpp:               15_000,
        oas:                7_500,
      },
      {
        label: "Scenario 3",
        portfolio:      5_000_000,
        spending:         175_000,
        retirementAge:         49,
        equityPct:             55,
        lifeExpectancy:        92,
        ssClaimAge:            70,
        ssBenefit:         53_000,
        cpp:               15_000,
        oas:                7_500,
      },
    ];

    const SS_BY_AGE = { 62: 25_000, 67: 41_500, 70: 53_000 };

    // ─────────────────────────────────────────────────────────────────────────────
    // MORNINGSTAR 2025 SAFE WITHDRAWAL RATE TABLE (Exhibit 34)
    // ─────────────────────────────────────────────────────────────────────────────
    const SWR = {
      100: { 10: 8.4, 15: 5.8, 20: 4.6, 25: 3.8, 30: 3.4, 35: 3.2, 40: 3.0 },
       90: { 10: 8.6, 15: 6.0, 20: 4.7, 25: 3.9, 30: 3.5, 35: 3.2, 40: 3.0 },
       80: { 10: 8.8, 15: 6.1, 20: 4.9, 25: 4.1, 30: 3.6, 35: 3.3, 40: 3.1 },
       70: { 10: 9.1, 15: 6.3, 20: 5.0, 25: 4.2, 30: 3.7, 35: 3.4, 40: 3.2 },
       60: { 10: 9.3, 15: 6.5, 20: 5.2, 25: 4.3, 30: 3.8, 35: 3.4, 40: 3.2 },
       50: { 10: 9.5, 15: 6.6, 20: 5.3, 25: 4.4, 30: 3.9, 35: 3.5, 40: 3.3 },
       40: { 10: 9.7, 15: 6.7, 20: 5.3, 25: 4.4, 30: 3.9, 35: 3.5, 40: 3.2 },
       30: { 10: 9.8, 15: 6.8, 20: 5.3, 25: 4.4, 30: 3.9, 35: 3.5, 40: 3.2 },
       20: { 10: 9.8, 15: 6.8, 20: 5.3, 25: 4.4, 30: 3.8, 35: 3.4, 40: 3.1 },
       10: { 10: 9.7, 15: 6.7, 20: 5.2, 25: 4.3, 30: 3.7, 35: 3.3, 40: 3.0 },
        0: { 10: 9.6, 15: 6.5, 20: 5.0, 25: 4.1, 30: 3.5, 35: 3.0, 40: 2.7 },
    };

    function getSafeRate(equityPct, horizon) {
      const eq = Math.max(0, Math.min(100, Math.round(equityPct / 10) * 10));
      const row = SWR[eq];
      const bands = [10, 15, 20, 25, 30, 35, 40];
      const h = Math.max(10, Math.min(40, horizon));
      const lo = bands.reduce((a, b) => (b <= h ? b : a), 10);
      const hi = bands.find(b => b >= h) ?? 40;
      if (lo === hi) return row[lo];
      const t = (h - lo) / (hi - lo);
      return +(row[lo] + t * (row[hi] - row[lo])).toFixed(2);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // CAPITAL MARKET ASSUMPTIONS (Morningstar forward-looking, real returns)
    // Source: Morningstar State of Retirement Income 2025
    // ─────────────────────────────────────────────────────────────────────────────
    const CMA = {
      equity: 0.057,  // expected real return for equities
      bond:   0.020,  // expected real return for fixed income
      spread: 0.02,   // +/- spread for optimistic/pessimistic scenarios
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // MORNINGSTAR WITHDRAWAL METHODS (Exhibit 15 — 40% equity / 30yr / 90% success)
    // Premium-over-base-case extrapolation for non-30yr horizons
    // ─────────────────────────────────────────────────────────────────────────────
    const METHODS = [
      { id: "fixed",     name: "Fixed Real (Base Case)",     premium: 0,    std: 0,    spendEnd: "45/55", desc: "Withdraw a fixed inflation-adjusted amount each year. Simplest approach — no adjustments needed, but requires the lowest starting rate." },
      { id: "forgo",     name: "Forgo Inflation After Loss",  premium: 0.40, std: 5.5,  spendEnd: "48/52", desc: "Skip the inflation increase in any year following a portfolio loss. Minimal income volatility for a meaningful rate boost." },
      { id: "rmd",       name: "RMD Method",                  premium: 0.82, std: 43.9, spendEnd: "93/7",  desc: "Withdraw based on IRS life expectancy divisors. High income volatility — spending tracks the portfolio closely, leaving little bequest." },
      { id: "guardrails",name: "Guardrails (Guyton-Klinger)",premium: 1.30, std: 28.9, spendEnd: "66/34", desc: "Cut spending 10% if rate exceeds 120% of initial; raise 10% if below 80%. Allows a high starting rate with structured adjustment rules." },
      { id: "decline",   name: "Actual Spending Decline",     premium: 1.10, std: 0,    spendEnd: "46/54", desc: "Assumes real spending naturally declines ~2%/yr in retirement (the 'go-go, slow-go, no-go' pattern). No volatility, but front-loads spending." },
      { id: "endowment", name: "Endowment (10yr Avg)",        premium: 1.80, std: 38.8, spendEnd: "58/42", desc: "Withdraw a fixed percentage of the 10-year rolling average portfolio value. Smooths volatility vs. constant percentage but still variable." },
      { id: "constant",  name: "Constant % of Balance",       premium: 1.80, std: 35.0, spendEnd: "58/42", desc: "Withdraw a fixed percentage of the current portfolio each year. Income rises and falls with the market — can never run out, but spending is volatile." },
      { id: "vanguard",  name: "Vanguard Floor/Ceiling",      premium: 1.20, std: 36.4, spendEnd: "59/41", desc: "Apply a fixed percentage, but cap annual changes: max +5% increase, max −2.5% decrease. Balances responsiveness with stability." },
    ];

    function getMethodRate(method, equityPct, horizon) {
      const baseRate = getSafeRate(equityPct, horizon);
      return +(baseRate + method.premium).toFixed(2);
    }

    function getExpectedReturn(equityPct) {
      const eq = equityPct / 100;
      return eq * CMA.equity + (1 - eq) * CMA.bond;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // MONTE CARLO SIMULATION ENGINE
    // ─────────────────────────────────────────────────────────────────────────────
    const MC = {
      trials: 1000,          // trials per success-rate check
      eqVol:  0.17,          // equity annualized real std dev
      bondVol: 0.06,         // bond annualized real std dev
      targetSuccess: 0.90,   // 90% success threshold
      searchIter: 15,        // binary-search iterations (~0.001% precision)
    };

    // Seeded PRNG — Mulberry32 (fast, deterministic)
    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Box-Muller: uniform → standard normal
    function boxMuller(rng) {
      const u1 = rng() || 1e-10;  // avoid log(0)
      const u2 = rng();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    // ── Strategy withdrawal functions ──
    // Each takes a state object and returns the withdrawal for that year.
    const WITHDRAW = {
      fixed: (s) => s.initialWD * Math.pow(1.025, s.year - 1),

      forgo: (s) => {
        if (s.year === 1) return s.initialWD;
        return s.lastReturn < 0 ? s.prevWD : s.prevWD * 1.025;
      },

      rmd: (s) => {
        const divisor = Math.max(1, s.horizon - s.year + 1);
        return s.portfolio / divisor;
      },

      guardrails: (s) => {
        if (s.year === 1) return s.initialWD;
        let wd = s.prevWD * 1.025;            // inflation-adjust
        const rate = wd / s.portfolio;
        const initRate = s.initialWD / s.P0;
        if (rate > initRate * 1.2) wd *= 0.9;      // cut 10%
        else if (rate < initRate * 0.8) wd *= 1.1;  // raise 10%
        return wd;
      },

      decline: (s) => s.initialWD * Math.pow(0.98, s.year - 1),

      endowment: (s) => {
        const pct = s.initialWD / s.P0;
        const hist = s.history.slice(-10);
        const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
        return pct * avg;
      },

      constant: (s) => {
        const pct = s.initialWD / s.P0;
        return pct * s.portfolio;
      },

      vanguard: (s) => {
        if (s.year === 1) return s.initialWD;
        const pct = s.initialWD / s.P0;
        const target = pct * s.portfolio;
        const ceil = s.prevWD * 1.05;
        const floor = s.prevWD * 0.975;
        return Math.min(ceil, Math.max(floor, target));
      },
    };

    // Run one trial: returns true if portfolio survives the full horizon
    function mcTrial(methodId, startRate, horizon, equityPct, rng) {
      const P0 = 1_000_000;
      const initialWD = (startRate / 100) * P0;
      const eq = equityPct / 100;
      let portfolio = P0, prevWD = initialWD, lastReturn = 0;
      const history = [P0];
      const fn = WITHDRAW[methodId];

      for (let y = 1; y <= horizon; y++) {
        const zEq = boxMuller(rng), zBd = boxMuller(rng);
        const yearR = eq * (CMA.equity + MC.eqVol * zEq)
                    + (1 - eq) * (CMA.bond + MC.bondVol * zBd);
        portfolio *= (1 + yearR);
        if (portfolio <= 0) return false;

        const wd = Math.max(0, fn({
          year: y, initialWD, P0, portfolio, prevWD, lastReturn, horizon, history,
        }));
        portfolio -= wd;
        // Depleted mid-plan = failure; depleted on the final year = success
        // (RMD, for example, withdraws everything in the last year by design)
        if (portfolio <= 0 && y < horizon) return false;

        prevWD = wd;
        lastReturn = yearR;
        history.push(portfolio);
      }
      return true;
    }

    // Success rate for a given method + starting rate
    function mcSuccessRate(methodId, startRate, horizon, equityPct, seed) {
      let ok = 0;
      for (let t = 0; t < MC.trials; t++) {
        if (mcTrial(methodId, startRate, horizon, equityPct, mulberry32(seed + t * 7919))) ok++;
      }
      return ok / MC.trials;
    }

    // Binary search for max safe rate at 90% success
    // Returns { rate, capped } — capped=true means the strategy can sustain any rate (e.g. constant %)
    function mcFindSafeRate(methodId, horizon, equityPct, seed) {
      let lo = 0.5, hi = 15.0;
      // Check if even the ceiling succeeds — if so, the method can't deplete
      if (mcSuccessRate(methodId, hi, horizon, equityPct, seed) >= MC.targetSuccess) {
        return { rate: hi, capped: true };
      }
      for (let i = 0; i < MC.searchIter; i++) {
        const mid = (lo + hi) / 2;
        if (mcSuccessRate(methodId, mid, horizon, equityPct, seed) >= MC.targetSuccess) lo = mid;
        else hi = mid;
      }
      return { rate: +lo.toFixed(2), capped: false };
    }

    // Run simulation for all 8 methods — returns { methodId: { safeRate, successRate, capped } }
    function mcRunAll(horizon, equityPct) {
      const seed = 42;
      const results = {};
      for (const m of METHODS) {
        const { rate, capped } = mcFindSafeRate(m.id, horizon, equityPct, seed);
        results[m.id] = {
          safeRate: rate,
          successRate: capped ? 1.0 : mcSuccessRate(m.id, rate, horizon, equityPct, seed),
          capped,
        };
      }
      return results;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // PORTFOLIO PROJECTION (strategy-aware)
    // ─────────────────────────────────────────────────────────────────────────────
    function buildProjection(inputs, methodId = "fixed") {
      const { portfolio, spending, retirementAge, lifeExpectancy, ssClaimAge, ssBenefit, cpp, oas, equityPct } = inputs;
      const totalBenefits = ssBenefit + cpp + oas;
      const years = lifeExpectancy - retirementAge;
      const bridge = ssClaimAge - retirementAge;
      const expected = getExpectedReturn(equityPct);
      const RETURNS = {
        pessimistic: expected - CMA.spread,
        base:        expected,
        optimistic:  expected + CMA.spread,
      };
      const withdrawFn = WITHDRAW[methodId];

      // Per-scenario state for variable withdrawal methods
      const sc = {};
      for (const key of Object.keys(RETURNS)) {
        sc[key] = { bal: portfolio, prevWD: spending, lastR: 0, hist: [portfolio] };
      }

      const data = [{ year: 0, age: retirementAge, pessimistic: portfolio, base: portfolio, optimistic: portfolio }];

      for (let y = 1; y <= years; y++) {
        const age = retirementAge + y;
        const benefitsYear = age >= ssClaimAge
          ? totalBenefits * Math.pow(1.025, age - ssClaimAge)
          : 0;

        // At the SS transition year, insert a phantom point showing where
        // the portfolio would be WITHOUT benefits, so the line reaches the
        // SS marker before bending. Use year - 0.01 so it sorts just before.
        if (y === bridge && totalBenefits > 0) {
          const phantom = { year: y - 0.01, age };
          for (const [key, r] of Object.entries(RETURNS)) {
            const s = sc[key];
            if (s.bal === null) { phantom[key] = null; continue; }
            const grown = s.bal * (1 + r);
            const wdState = { year: y, initialWD: spending, P0: portfolio, portfolio: grown,
              prevWD: s.prevWD, lastReturn: s.lastR, horizon: years, history: s.hist };
            const grossWD = Math.max(0, withdrawFn(wdState));
            const next = grown - grossWD;  // no benefit offset for phantom
            phantom[key] = next <= 0 ? 0 : next;
          }
          data.push(phantom);
        }

        const point = { year: y, age };
        for (const [key, r] of Object.entries(RETURNS)) {
          const s = sc[key];
          if (s.bal === null) { point[key] = null; continue; }
          const grown = s.bal * (1 + r);
          const wdState = { year: y, initialWD: spending, P0: portfolio, portfolio: grown,
            prevWD: s.prevWD, lastReturn: s.lastR, horizon: years, history: s.hist };
          const grossWD = Math.max(0, withdrawFn(wdState));
          const netWD = Math.max(0, grossWD - benefitsYear);
          const next = grown - netWD;
          s.bal = next <= 0 ? null : next;
          s.prevWD = grossWD;
          s.lastR = r;
          s.hist.push(s.bal || 0);
          point[key] = s.bal === null ? 0 : s.bal;
        }
        data.push(point);
      }
      return data;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // HELPERS & CONSTANTS
    // ─────────────────────────────────────────────────────────────────────────────
    const fmtDollars = n => {
      if (n == null) return "\u2014";
      if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(2)}M`;
      if (n >= 1_000)     return `$${(n / 1_000).toFixed(0)}K`;
      return `$${n.toFixed(0)}`;
    };
    const fmtPct = n => `${n.toFixed(1)}%`;

    const STATUS = {
      safe:       { label: "\u2713 Safe",       color: "#22c55e", bg: "rgba(34,197,94,0.12)",  text: "Within safe withdrawal range" },
      marginal:   { label: "~ Marginal",   color: "#f59e0b", bg: "rgba(245,158,11,0.12)", text: "Consider Guardrails approach" },
      aggressive: { label: "\u26A0 Aggressive", color: "#ef4444", bg: "rgba(239,68,68,0.12)",  text: "Above safe withdrawal range" },
    };

    function classify(rate, safe) {
      if (rate <= safe)       return "safe";
      if (rate <= safe + 0.5) return "marginal";
      return "aggressive";
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // SHARED SUB-COMPONENTS (module-level)
    // ─────────────────────────────────────────────────────────────────────────────
    function SectionLabel({ children, mt = 18 }) {
      return (
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em",
          textTransform: "uppercase", color: "#94a3b8", marginBottom: 8, marginTop: mt }}>
          {children}
        </div>
      );
    }

    function MetricCard({ label, value, sub, valueColor = "#f8fafc", children, style: extraStyle }) {
      return (
        <div style={{ background: "#0f172a", borderRadius: 8, padding: "14px 12px", minWidth: 0, ...extraStyle }}>
          <div style={{ fontSize: 10, color: "#64748b", letterSpacing: "0.06em",
            textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
          {value && <div style={{ fontSize: 22, fontWeight: 800, color: valueColor, lineHeight: 1, marginBottom: 4 }}>{value}</div>}
          {children}
          {sub && <div style={{ fontSize: 11, color: "#475569", marginTop: 4 }}>{sub}</div>}
        </div>
      );
    }

    function Slider({ label, value, onChange, min, max, step, fmt }) {
      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontSize: 12, color: "#64748b", fontWeight: 500 }}>{label}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#0f172a" }}>{fmt(value)}</span>
          </div>
          <input type="range" min={min} max={max} step={step} value={value}
            onChange={e => onChange(Number(e.target.value))}
            style={{ width: "100%", accentColor: "#3b82f6", cursor: "pointer" }} />
        </div>
      );
    }

    function Badge({ s, size = 13 }) {
      const c = STATUS[s];
      return (
        <span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 20,
          fontSize: size, fontWeight: 700, background: c.bg, color: c.color }}>
          {c.label}
        </span>
      );
    }

    function ChartTooltip({ active, payload, label }) {
      if (!active || !payload?.length) return null;
      return (
        <div style={{ background: "#0f172a", border: "1px solid #334155",
          borderRadius: 6, padding: "8px 12px", fontSize: 12 }}>
          <div style={{ color: "#94a3b8", marginBottom: 4 }}>Year {label}</div>
          {payload.map(p => p.value != null && (
            <div key={p.dataKey} style={{ color: p.color, marginBottom: 2 }}>
              {p.name}: {fmtDollars(p.value)}
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // MAIN COMPONENT
    // ─────────────────────────────────────────────────────────────────────────────
    function RetirementExplorer() {
      const [inp, setInp]               = useState({ ...INITIAL_SCENARIOS[0] });
      const [scenarios, setScenarios]   = useState(INITIAL_SCENARIOS.map(s => ({ ...s })));
      const [activeSlot, setActiveSlot] = useState(0);
      const [editingIdx, setEditingIdx] = useState(null);
      const [editingVal, setEditingVal] = useState("");
      const [savedIdx, setSavedIdx]     = useState(null);
      const [activeTab, setActiveTab]   = useState("analysis");  // "analysis" | "methods"
      const [apiKey, setApiKey]         = useState("");
      const [analysis, setAnalysis]     = useState("");
      const [analyzing, setAnalyzing]   = useState(false);
      const [apiError, setApiError]     = useState("");
      const [mcResults, setMcResults]   = useState(null);      // { methodId: { safeRate, successRate } }
      const [mcRunning, setMcRunning]   = useState(false);
      const [mcInputs, setMcInputs]    = useState(null);       // snapshot of inputs when MC was run
      const [chartMethod, setChartMethod] = useState("fixed"); // strategy for projection chart
      const [mcView, setMcView]         = useState("mc");      // "mc" | "est" — which data to show in methods table

      // ── Scenario slot actions ──
      function loadSlot(i) {
        setInp({ ...scenarios[i] });
        setActiveSlot(i);
        setAnalysis("");
        setApiError("");
      }

      function saveToSlot(i, e) {
        e.stopPropagation();
        setScenarios(prev => prev.map((s, idx) =>
          idx === i ? { ...inp, label: s.label } : s
        ));
        setActiveSlot(i);
        setSavedIdx(i);
        setTimeout(() => setSavedIdx(null), 1800);
      }

      function startRename(i, e) {
        e.stopPropagation();
        setEditingIdx(i);
        setEditingVal(scenarios[i].label);
      }

      function commitRename(i) {
        if (editingVal.trim()) {
          setScenarios(prev => prev.map((s, idx) =>
            idx === i ? { ...s, label: editingVal.trim() } : s
          ));
        }
        setEditingIdx(null);
      }

      // ── Input helpers ──
      function set(key, val) {
        setInp(prev => ({ ...prev, [key]: val }));
        setActiveSlot(null);
      }

      function setSsAge(age) {
        setInp(prev => ({ ...prev, ssClaimAge: age, ssBenefit: SS_BY_AGE[age] ?? prev.ssBenefit }));
        setActiveSlot(null);
      }

      // ── Derived values ──
      const horizon        = inp.lifeExpectancy - inp.retirementAge;
      const withdrawalRate = (inp.spending / inp.portfolio) * 100;
      const safeRate       = getSafeRate(inp.equityPct, horizon);
      const bridge         = inp.ssClaimAge - inp.retirementAge;
      const totalBenefits  = inp.ssBenefit + inp.cpp + inp.oas;
      const netDraw        = Math.max(0, inp.spending - totalBenefits);
      const adjustedRate   = (netDraw / inp.portfolio) * 100;
      const status         = classify(withdrawalRate, safeRate);
      const adjStatus      = classify(adjustedRate, safeRate);
      const bridgeColor    = bridge > 15 ? "#ef4444" : bridge >= 10 ? "#f59e0b" : "#22c55e";
      const expectedReturn = getExpectedReturn(inp.equityPct);
      const returnPess     = ((expectedReturn - CMA.spread) * 100).toFixed(1);
      const returnBase     = (expectedReturn * 100).toFixed(1);
      const returnOpt      = ((expectedReturn + CMA.spread) * 100).toFixed(1);

3. One practical insight or consideration most people overlook in this specific scenario

Be direct and specific. No boilerplate. Reference actual numbers. Do not give investment advice or say "consult a financial advisor."`;

        try {

            method: "POST",
            headers: {
              "x-api-key": apiKey.trim(),
              "anthropic-version": "2023-06-01",

                  </button>
                </div>
                <p style={{ fontSize: 11, color: "#94a3b8", marginBottom: 10, lineHeight: 1.6 }}>
                  Requires an Anthropic API key &mdash; separate from a Claude.ai subscription.{" "}
                  <a href="https://console.anthropic.com" target="_blank" rel="noreferrer" style={{ color: "#3b82f6" }}>
                    Get one at console.anthropic.com &rarr;
                  </a>{" "}
                  Keys start with{" "}
                  <code style={{ background: "#e2e8f0", padding: "1px 4px", borderRadius: 3, fontSize: 10 }}>sk-ant-</code>.
                  {" "}Not stored anywhere.
                </p>
                {apiError && (
                  <div style={{ background: "rgba(239,68,68,0.08)", border: "1px solid #ef4444",
                    borderRadius: 6, padding: "8px 12px", fontSize: 12, color: "#dc2626", marginBottom: 8 }}>
                    {apiError}
                  </div>
                )}
                <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 6,
                  padding: 12, fontSize: 13, color: "#475569", lineHeight: 1.7, minHeight: 88 }}>
                  {analysis
                    ? <span style={{ whiteSpace: "pre-wrap" }}>{analysis}</span>
                    : <span style={{ color: "#cbd5e1", fontStyle: "italic" }}>
                        Analysis will appear here. The calculator above works fully without an API key.
                      </span>
                  }
                </div>
              </div>

              </>}

              {/* ═══ COMPARE METHODS TAB ═══ */}
              {activeTab === "methods" && <>

                {/* Intro */}
                <div style={{ marginBottom: 16 }}>
                  {/* Header row: title + actions */}
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#0f172a" }}>
                      Withdrawal Strategy Comparison
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {/* Estimated / Simulated toggle — only shown after MC has run */}
                      {mcResults && (
                        <div style={{ display: "flex", border: "1px solid #e2e8f0", borderRadius: 6, overflow: "hidden" }}>
                          {[["est", "Estimated"], ["mc", "Simulated"]].map(([key, label]) => (
                            <button key={key} onClick={() => setMcView(key)} style={{
                              padding: "5px 12px", fontSize: 11, fontWeight: 600, cursor: "pointer",
                              border: "none",
                              background: mcView === key ? "#0f172a" : "white",
                              color: mcView === key ? "white" : "#64748b",
                            }}>{label}</button>
                          ))}
                        </div>
                      )}
                      <button onClick={handleRunMC} disabled={mcRunning} style={{
                        background: mcRunning ? "#475569" : "#0f172a", color: "white",
                        border: "none", borderRadius: 6, padding: "8px 18px",
                        fontSize: 12, fontWeight: 600,
                        cursor: mcRunning ? "not-allowed" : "pointer",
                      }}>
                        {mcRunning ? "Running simulation\u2026" : mcResults && !mcStale ? "Re-run Monte Carlo" : "Run Monte Carlo (1,000 trials)"}
                      </button>
                    </div>
                  </div>
                  <p style={{ fontSize: 12, color: "#64748b", lineHeight: 1.6, marginBottom: 8 }}>
                    Eight withdrawal methods from Morningstar's <em>State of Retirement Income 2025</em>,
                    for your current inputs: {inp.equityPct}% equity, {horizon}-year horizon.
                    {mcResults && !mcStale && mcView === "mc"
                      ? " Rates computed via Monte Carlo simulation (1,000 trials, 90% success, seeded PRNG)."
                      : " Rates estimated via premium extrapolation from Morningstar\u2019s 30-year / 40% equity data."}
                  </p>
                  {mcStale && mcView === "mc" && (
                    <div style={{ background: "#fef3c7", border: "1px solid #fcd34d", borderRadius: 6,
                      padding: "8px 12px", fontSize: 11, color: "#92400e", lineHeight: 1.5, marginBottom: 8 }}>
                      Inputs have changed since last simulation ({mcInputs.equityPct}% equity, {mcInputs.horizon}yr).
                      Showing stale MC results &mdash; click <strong>Re-run Monte Carlo</strong> to update.
                    </div>
                  )}
                  {(!mcResults || mcView === "est") && (
                    <div style={{ background: "#fef3c7", border: "1px solid #fcd34d", borderRadius: 6,
                      padding: "8px 12px", fontSize: 11, color: "#92400e", lineHeight: 1.5 }}>
                      Rates for non-base-case methods are estimated via premium extrapolation from Morningstar's
                      30-year / 40% equity data.{!mcResults && " Run Monte Carlo for simulation-based rates specific to your inputs."}
                    </div>
                  )}
                  {mcResults && !mcStale && mcView === "mc" && (
                    <div style={{ background: "#ecfdf5", border: "1px solid #6ee7b7", borderRadius: 6,
                      padding: "8px 12px", fontSize: 11, color: "#065f46", lineHeight: 1.5 }}>
                      Monte Carlo results: {MC.trials} trials per rate test, {MC.searchIter}-step binary search,
                      seeded PRNG (reproducible). Returns: equity {(CMA.equity*100).toFixed(1)}% &plusmn; {(MC.eqVol*100).toFixed(0)}% vol,
                      bonds {(CMA.bond*100).toFixed(1)}% &plusmn; {(MC.bondVol*100).toFixed(0)}% vol.
                    </div>
                  )}
                </div>

                {/* Summary cards */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
                  <MetricCard
                    label="Your Withdrawal Rate"
                    value={fmtPct(withdrawalRate)}
                    sub={`${fmtDollars(inp.spending)}/yr`}
                    valueColor={STATUS[status].color}
                  />
                  <MetricCard
                    label={`Base Starting Rate \u00B7 ${horizon}yr`}
                    value={fmtPct(mcResults && !mcStale && mcView === "mc" ? mcResults.fixed.safeRate : safeRate)}
                    sub={mcResults && !mcStale && mcView === "mc" ? "Monte Carlo \u00B7 Fixed Real" : "Morningstar table \u00B7 Fixed Real"}
                    valueColor="#60a5fa"
                  />
                  <MetricCard label="Methods in Range">
                    <div style={{ fontSize: 22, fontWeight: 800, color: "#22c55e", lineHeight: 1, marginBottom: 4 }}>
                      {METHODS.filter(m => {
                        if (m.id === "rmd") return (inp.portfolio / horizon) >= inp.spending;
                        if (m.id === "constant") return (getExpectedReturn(inp.equityPct) * inp.portfolio) >= inp.spending;
                        const r = mcResults && !mcStale && mcView === "mc" ? mcResults[m.id].safeRate : getMethodRate(m, inp.equityPct, horizon);
                        return r >= withdrawalRate;
                      }).length} of {METHODS.length}
                    </div>
                    <div style={{ fontSize: 11, color: "#475569" }}>
                      strategies can support your spending
                    </div>
                  </MetricCard>
                </div>

                {/* Methods table */}
                <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 8, overflow: "hidden" }}>
                  {/* Table header */}
                  <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr",
                    gap: 0, padding: "10px 14px", background: "#f8fafc", borderBottom: "1px solid #e2e8f0",
                    fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#94a3b8" }}>
                    <div>Strategy</div>
                    <div style={{ textAlign: "right" }}>{mcResults && !mcStale && mcView === "mc" ? "MC Starting Rate" : "Est. Starting Rate"}<br/><span style={{ fontWeight: 400, fontSize: 9, letterSpacing: 0, textTransform: "none" }}>(year-1 as % of portfolio)</span></div>
                    <div style={{ textAlign: "right" }}>Year-1 Withdrawal</div>
                    <div style={{ textAlign: "right" }}>Income Volatility</div>
                    <div style={{ textAlign: "right" }}>Spend/Bequest</div>
                  </div>

                  {/* Method rows */}
                  {METHODS.map((m, i) => {
                    const useMC = mcResults && !mcStale && mcView === "mc";
                    const isCapped = useMC && mcResults[m.id].capped;
                    // RMD and Constant % are formula-driven — no user-chosen starting rate
                    const isFormulaDriven = m.id === "rmd" || m.id === "constant";
                    const mRate = useMC ? mcResults[m.id].safeRate : getMethodRate(m, inp.equityPct, horizon);
                    // For formula-driven strategies, show actual Year-1 withdrawal regardless of MC state
                    let yr1, yr1Note;
                    if (isFormulaDriven && m.id === "rmd") {
                      yr1 = inp.portfolio / horizon;  // RMD: portfolio ÷ remaining years
                      yr1Note = `portfolio \u00F7 ${horizon}yr`;
                    } else if (isFormulaDriven && m.id === "constant") {
                      const reasonablePct = getExpectedReturn(inp.equityPct) * 100;
                      yr1 = (reasonablePct / 100) * inp.portfolio;
                      yr1Note = `${reasonablePct.toFixed(1)}% of balance`;
                    } else {
                      yr1 = (mRate / 100) * inp.portfolio;
                      yr1Note = null;
                    }
                    const isBase = m.premium === 0;
                    // For formula-driven methods, check if actual Year-1 withdrawal covers spending
                    const canSupport = isFormulaDriven ? yr1 >= inp.spending : mRate >= withdrawalRate;
                    return (
                      <div key={m.id} style={{
                        display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr",
                        gap: 0, padding: "12px 14px", alignItems: "start",
                        borderBottom: i < METHODS.length - 1 ? "1px solid #f1f5f9" : "none",
                        background: canSupport ? "rgba(34,197,94,0.04)" : "transparent",
                      }}>
                        {/* Name + description */}
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#0f172a" }}>{m.name}</span>
                            {isBase && <span style={{ fontSize: 9, background: "#e2e8f0", color: "#64748b",
                              padding: "1px 6px", borderRadius: 8, fontWeight: 600 }}>BASE</span>}
                          </div>
                          <div style={{ fontSize: 11, color: "#94a3b8", lineHeight: 1.5 }}>{m.desc}</div>
                        </div>

                        {/* Rate */}
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 15, fontWeight: 800,
                            color: isFormulaDriven
                              ? (canSupport ? "#22c55e" : yr1 >= inp.spending * 0.8 ? "#f59e0b" : "#ef4444")
                              : canSupport ? "#22c55e" : withdrawalRate <= mRate + 0.5 ? "#f59e0b" : "#ef4444" }}>
                            {isFormulaDriven ? "N/A" : `${mRate.toFixed(1)}%`}
                          </div>
                          {isFormulaDriven
                            ? <div style={{ fontSize: 10,
                                color: canSupport ? "#6ee7b7" : yr1 >= inp.spending * 0.8 ? "#fbbf24" : "#f87171" }}>
                                can{"\u2019"}t deplete
                              </div>
                            : useMC
                              ? <div style={{ fontSize: 10, color: "#6ee7b7" }}>MC {(mcResults[m.id].successRate * 100).toFixed(0)}% success</div>
                              : m.premium > 0 && <div style={{ fontSize: 10, color: "#94a3b8" }}>+{m.premium.toFixed(1)}% premium</div>
                          }
                        </div>

                        {/* Year-1 withdrawal */}
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "#1e293b" }}>{fmtDollars(yr1)}</div>
                          <div style={{ fontSize: 10, color: "#94a3b8" }}>{yr1Note || "/yr"}</div>
                        </div>

                        {/* Volatility */}
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 13, fontWeight: 600,
                            color: m.std === 0 ? "#22c55e" : m.std < 10 ? "#3b82f6" : m.std < 30 ? "#f59e0b" : "#ef4444" }}>
                            {m.std === 0 ? "None" : m.std.toFixed(0) + "%"}
                          </div>
                          <div style={{ fontSize: 10, color: "#94a3b8" }}>cash flow STD</div>
                        </div>

                        {/* Spend/End */}
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "#475569" }}>{m.spendEnd}</div>
                          <div style={{ fontSize: 10, color: "#94a3b8" }}>spend/bequest</div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Excluded method note */}
                <div style={{ marginTop: 12, padding: "10px 14px", background: "#f8fafc",
                  border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 11, color: "#94a3b8", lineHeight: 1.6 }}>
                  <strong style={{ color: "#64748b" }}>Excluded: Probability-Based Guardrails.</strong>{" "}
                  This method requires re-running a simulation every year of every trial to recalculate success
                  probability. The output isn't meaningfully different from Guardrails (Guyton-Klinger) for most users.
                </div>

                {/* Interpretation guide */}
                <div style={{ marginTop: 12, padding: "12px 14px", background: "#eff6ff",
                  border: "1px solid #bfdbfe", borderRadius: 6, fontSize: 12, color: "#1e40af", lineHeight: 1.6 }}>
                  <strong>How to read this:</strong> Your withdrawal rate is {fmtPct(withdrawalRate)}.
                  Any strategy with a safe rate {"\u2265"} {fmtPct(withdrawalRate)} (shown in green) could
                  theoretically support your spending at 90% success.
                  Higher-rate strategies come with trade-offs &mdash; mainly income volatility
                  (your spending fluctuates year to year) or reduced bequest potential.
                  The "Spend/Bequest" ratio shows what fraction of wealth goes to spending vs. what's left at end of plan.
                </div>

                {/* MC methodology note */}
                {mcResults && !mcStale && mcView === "mc" && (
                  <div style={{ marginTop: 12, padding: "12px 14px", background: "#f8fafc",
                    border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 11, color: "#64748b", lineHeight: 1.6 }}>
                    <strong>Monte Carlo methodology:</strong> Each strategy's safe rate is found via binary search
                    over {MC.trials} trials per rate test. Each trial generates independent annual returns from a normal
                    distribution (equity: {(CMA.equity*100).toFixed(1)}% mean / {(MC.eqVol*100)}% vol; bonds: {(CMA.bond*100).toFixed(1)}% mean / {(MC.bondVol*100)}% vol).
                    Portfolio returns are weighted by allocation. A trial "fails" if the portfolio hits zero before the
                    planning horizon. The safe rate is the highest starting rate achieving {"\u2265"}90% survival.
                    Results are deterministic (seeded PRNG) so re-running with the same inputs produces identical output.
                  </div>
                )}

              </>}

            </div>
          </div>
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RetirementExplorer />);
  </script>
</body>
</html>
